name: Test
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      ROS_DISTRO: ${{ matrix.ros_distro }}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      DEBIAN_FRONTEND: noninteractive
    # Official image: stable ROS apt repo (the setup-ros :master images use
    # ros2-testing, which breaks with upstream churn).
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
          ros_distro: [lyrical]
    steps:
    - uses: actions/checkout@v4
      with:
        path: ros_ws/src/opennav_coverage

    - name: Install dependencies
      # nav2, Fields2Cover and BehaviorTree.CPP all come as binaries.
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          python3-colcon-common-extensions \
          ros-${{ matrix.ros_distro }}-rmw-cyclonedds-cpp
        rosdep update --rosdistro ${{ matrix.ros_distro }}
        rosdep install --from-paths ros_ws/src --ignore-src \
          --rosdistro ${{ matrix.ros_distro }} -y

    - name: Build
      run: |
        cd ros_ws
        . /opt/ros/${{ matrix.ros_distro }}/setup.sh
        colcon build

    - name: Test
      run: |
        cd ros_ws
        . /opt/ros/${{ matrix.ros_distro }}/setup.sh
        . install/setup.sh
        colcon test --event-handlers console_cohesion+
        colcon test-result --verbose

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: colcon-logs
        path: ros_ws/log
